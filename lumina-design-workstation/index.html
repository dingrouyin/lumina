<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumina - AI Design Workstation</title>
  <script>
    // 在 React 挂载前就应用主题，避免先亮后暗的闪烁
    try {
      const saved = localStorage.getItem('lumina-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (saved !== 'light' && prefersDark)) {
        document.documentElement.classList.add('dark');
      }
    } catch (e) {}
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Inter', system-ui, "SF Pro SC", "SF Pro Text", "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    * {
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    .canvas-bg {
      background-image: radial-gradient(rgba(0, 0, 0, 0.04) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }

    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .no-touch {
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    /* 抑制默认 focus ring，防止在 rounded-full 按钮上显示为蓝绿圆形 */
    button:focus,
    button:focus-visible,
    [type="range"]:focus,
    [type="color"]:focus,
    [type="file"]:focus,
    input:focus {
      outline: none !important;
      box-shadow: none !important;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "html2canvas": "https://esm.sh/html2canvas@^1.4.1",
    "react-markdown": "https://esm.sh/react-markdown@^8.0.7"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <style>
    /* 彻底规则：隐藏并禁用被外部注入到 body 下的所有非核心元素（解决蓝/青色圆点问题） */
    body>*:not(#root):not(#debug-banner):not(script):not(link):not(style):not(iframe) {
      display: none !important;
      pointer-events: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
    }
  </style>
  <div id="root"></div>
  <script>
    // 巡检脚本：解决 Bug#1（青色圆点注入）
    const observer = new MutationObserver((mutations) => {
      mutations.forEach((mutation) => {
        mutation.addedNodes.forEach((node) => {
          if (node.nodeType === 1 && node.parentNode === document.body) {
            const id = node.id;
            if (id !== 'root' && id !== 'debug-banner' && node.tagName !== 'SCRIPT' && node.tagName !== 'LINK' && node.tagName !== 'STYLE' && node.tagName !== 'IFRAME') {
              console.log('Cleaning up unauthorized injection:', node);
              node.remove();
            }
          }
        });
      });
    });
    observer.observe(document.body, { childList: true });
  </script>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
